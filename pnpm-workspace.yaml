packages:
  - packages/*
  - apps/*
  - e2e

allowBuilds:
  esbuild: true
  # ssh2 (cloud workstations over SSH) works in pure JavaScript; its optional native add-ons are not built.
  ssh2: false
  cpu-features: false

minimumReleaseAgeExclude:
  - '@ai-sdk/anthropic@4.0.87'
  - '@ai-sdk/gateway@4.0.123'
  - '@ai-sdk/google@4.0.104'
  - '@ai-sdk/openai-compatible@3.0.77'
  - '@ai-sdk/openai@4.0.101'
  - '@ai-sdk/provider-utils@5.0.67'
  - '@ai-sdk/provider@4.0.33'
  - ai@7.0.150

# Transitive dependencies with published security fixes that their parents have not picked up yet.
overrides:
  shell-quote: '>=1.11.0'
  '@vitest/mocker': '>=4.1.12 <5'
  'fast-uri@>=3 <4': '^3.1.9'
  'fast-uri@>=4 <5': '^4.2.3'
  'esbuild@>=0.27.3 <0.28.1': '^0.28.1'
  'undici@>=8 <8.12.2': '^8.12.2'
