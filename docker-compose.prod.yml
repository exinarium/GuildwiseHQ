# Self-hosted production stack: app (API + web) + media (help videos) + Postgres + Caddy (HTTPS).
#   cp .env.prod.example .env && edit it, then:  docker compose -f docker-compose.prod.yml up -d --build
# See docs/SELF-HOSTING.md.
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: aom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: aom
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aom -d aom"]
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://aom:${POSTGRES_PASSWORD}@postgres:5432/aom
      # The URL users type, including the port when it is not 443. Cookies are Secure when it starts with https.
      AOM_PUBLIC_ORIGIN: ${AOM_PUBLIC_ORIGIN:?set AOM_PUBLIC_ORIGIN in .env}
      AOM_SMTP_URL: ${AOM_SMTP_URL:-smtp://mailpit:1025}
      AOM_MAIL_FROM: ${AOM_MAIL_FROM:-Guildwise HQ <noreply@aom.local>}
      # Inbound e-mail (platform owner's one-time set-up, docs/SELF-HOSTING.md "Inbound e-mail"): all three, or none.
      AOM_INBOUND_PROVIDER: ${AOM_INBOUND_PROVIDER:-}
      AOM_INBOUND_DOMAIN: ${AOM_INBOUND_DOMAIN:-}
      AOM_INBOUND_SECRET: ${AOM_INBOUND_SECRET:-}
      # Web Push (docs/SELF-HOSTING.md "Web Push"): all three, or push stays off.
      AOM_VAPID_PUBLIC_KEY: ${AOM_VAPID_PUBLIC_KEY:-}
      AOM_VAPID_PRIVATE_KEY: ${AOM_VAPID_PRIVATE_KEY:-}
      AOM_VAPID_SUBJECT: ${AOM_VAPID_SUBJECT:-}
      # Encrypts two-factor seeds and connected-account tokens at rest. REQUIRED: the server refuses to start in production
      # without it (set a long random string in .env and keep it with your backups, see docs/SELF-HOSTING.md).
      AOM_SECRET_KEY: ${AOM_SECRET_KEY:?set AOM_SECRET_KEY in .env (a long random string, e.g. openssl rand -base64 32)}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Simulation organizations keep their runner data and local repositories here (see docs/SELF-HOSTING.md).
      AOM_SIMULATION_DIR: /data/simulation
      # The help videos: the app forwards /videos/* to the media service (unset = no videos). The videos are served by the media service (docs/SELF-HOSTING.md, Troubleshooting).
      AOM_MEDIA_URL: ${AOM_MEDIA_URL:-http://media:80}
    volumes:
      - simulation:/data/simulation
    expose:
      - "4600"

  # The help videos (media/Dockerfile): built from media/ only, so an app release never rebuilds or re-uploads them.
  # scripts/media-changed.sh tells whether media/ changed; scripts/media-build.sh builds the image with its content hash.
  media:
    build:
      context: ./media
      args:
        MEDIA_HASH: ${MEDIA_HASH:-}
    image: ${AOM_MEDIA_IMAGE:-aom-media:latest}
    restart: unless-stopped
    expose:
      - "80"

  # Optional catch-all mail sink for trying the stack without an SMTP relay: --profile mail (UI on 127.0.0.1:8025).
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AOM_MAILPIT_PORT:-8025}:8025"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      AOM_DOMAIN: ${AOM_DOMAIN:-localhost}
    ports:
      - "${AOM_HTTP_PORT:-80}:80"
      - "${AOM_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  simulation:
  caddy_data:
  caddy_config:
