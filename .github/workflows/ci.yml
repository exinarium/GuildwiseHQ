name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token and no secrets: pull requests from forks run exactly the same jobs safely.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary:
    name: Core imports nothing from the hosted extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-no-cloud-imports.sh

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm lint

  web-shared-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aom/shared test
      - run: pnpm --filter @aom/web test
      - run: pnpm --filter @aom/runner test

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: aom
          POSTGRES_PASSWORD: aom
          POSTGRES_DB: aom_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U aom -d aom_test"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      AOM_TEST_DB_URL: postgres://aom:aom@127.0.0.1:5433/aom_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aom/server test -- --maxWorkers=3
