# Continuous integration.
#
# Safe for pull requests from forks: the trigger is `pull_request` (not `pull_request_target`), the token is read-only
# and no secrets are used. Keep it that way. See CONTRIBUTING.md, "Security notice for contributors and maintainers".
#
# Every action is pinned to the full commit SHA of a release (the version is in the comment). To update one, look up
# the SHA of the new release tag on the action's repository, for example:
#   gh api repos/actions/checkout/git/ref/tags/<tag>
# (an annotated tag needs one more step: gh api repos/<owner>/<repo>/git/tags/<sha> --jq .object.sha).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  # Only a new push to the same pull request replaces a running check; a push to main never cancels another.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  boundary:
    name: Core imports nothing from the hosted extension
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the dependency direction
        run: scripts/check-no-cloud-imports.sh

  checks:
    name: Typecheck and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm (version from packageManager in package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Lint and format check (Biome)
        run: pnpm lint

  shared-web:
    name: Shared and web tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm (version from packageManager in package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Shared package tests
        run: pnpm --filter @aom/shared test

      - name: Web app tests
        run: pnpm --filter @aom/web test

  runner:
    name: Runner tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm (version from packageManager in package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The sandbox tests run the agents' real sandbox: bubblewrap and socat, and (on Ubuntu 24.04) unprivileged user
      # namespaces, which the runner image restricts by default.
      - name: Install the sandbox tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Runner tests
        run: pnpm --filter @aom/runner test

  server:
    name: Server tests (Postgres 18)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        # A throwaway database for the test run only. It holds no secrets and is not reachable from outside the job.
        image: postgres:18
        env:
          POSTGRES_USER: aom
          POSTGRES_PASSWORD: aom
          POSTGRES_DB: aom_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U aom -d aom_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
      mailpit:
        # A catch-all mail sink: the tests that send mail read it back through its API (helpers/mailpit.ts).
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    env:
      AOM_TEST_DB_URL: postgres://aom:aom@127.0.0.1:5433/aom_test
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm (version from packageManager in package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Server tests
        run: pnpm --filter @aom/server test -- --maxWorkers=3
