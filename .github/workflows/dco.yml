# Developer Certificate of Origin check.
#
# Every commit in a pull request must carry a `Signed-off-by: Name <email>` line (added with `git commit -s`).
# Read-only, no secrets, `pull_request` trigger only (never `pull_request_target`), so it is safe for forks.
name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: Signed-off-by on every commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the pull request head with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check each commit for a Signed-off-by line
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          failed=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            if ! git log -1 --format=%B "$sha" | grep -Eq '^Signed-off-by: .+ <.+>$'; then
              echo "::error::Commit $sha has no Signed-off-by line. Add one with 'git commit -s' (see CONTRIBUTING.md)."
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Fix with: git rebase --signoff <base-branch>, then force-push your branch."
          fi
          exit "$failed"
