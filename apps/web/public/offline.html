<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>You're offline</title>
    <style>
      :root { color-scheme: light dark; --bg: #f5f6f8; --fg: #12161f; --muted: #4b5365; --brand: #3446d9; --brand-fg: #fff; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0b0e14; --fg: #e8ebf2; --muted: #a3acbd; --brand: #6b7bff; --brand-fg: #0b0e14; } }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 22rem; text-align: center; }
      h1 { font-size: 1.375rem; margin: 0 0 .5rem; }
      p { margin: 0 0 1.25rem; color: var(--muted); }
      a { display: inline-block; min-height: 44px; line-height: 44px; padding: 0 1.25rem; border-radius: 10px;
        background: var(--brand); color: var(--brand-fg); font-weight: 600; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Guildwise needs a connection to show your desk and boards. Check your network and try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
