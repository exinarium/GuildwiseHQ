<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Guildwise HQ - User Guide</title>
<style>
  @font-face { font-family: "Geist"; src: url("assets/fonts/geist-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; font-style: normal; }
  @font-face { font-family: "Geist"; src: url("assets/fonts/geist-latin-wght-italic.woff2") format("woff2"); font-weight: 100 900; font-style: italic; }
  @font-face { font-family: "Geist Mono"; src: url("assets/fonts/geist-mono-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  @page { size: A4; margin: 16mm 15mm 18mm 15mm; }
  :root { --brand: #3446d9; --navy: #0d1220; --brand-soft: #e8ebfd; --lime: #d4f24a; --ink: #111827; --muted: #4b5563; --line: #e5e7eb;
          --amber: #b45309; --amber-soft: #fffbeb; --green: #047857; --green-soft: #ecfdf5; --red: #b91c1c; --red-soft: #fef2f2; }
  * { box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { font-family: "Geist", "Liberation Sans", Arial, sans-serif; font-size: 10.5pt; line-height: 1.55; color: var(--ink); margin: 0; counter-reset: fig; }
  code { font-family: "Geist Mono", "Liberation Mono", monospace; font-size: 8.8pt; background: #f1f3f9; padding: 0 3px; border-radius: 3px; }
  a { color: var(--brand); text-decoration: none; }
  h1, h2, h3, h4 { line-height: 1.25; break-after: avoid; page-break-after: avoid; }
  h2 { font-size: 21pt; color: var(--navy); margin: 0 0 12px; padding-bottom: 7px; border-bottom: 3px solid var(--brand); letter-spacing: -.01em; }
  h3 { font-size: 13.5pt; color: var(--brand); margin: 22px 0 6px; }
  h4 { font-size: 11.5pt; margin: 16px 0 4px; color: var(--navy); }
  p { margin: 0 0 8px; }
  ul, ol { margin: 0 0 9px; padding-left: 20px; }
  li { margin: 2px 0; }
  .chapter { break-before: page; page-break-before: always; }
  .mk { display: block; height: 0; overflow: visible; font-size: 1pt; line-height: 1pt; color: #fff; }

  figure { margin: 10px 0 14px; break-inside: avoid; page-break-inside: avoid; text-align: center; }
  figure img { max-width: 100%; max-height: 118mm; border: 1px solid #d1d5db; border-radius: 6px; }
  figure.small img { max-height: 92mm; max-width: 78%; }
  figcaption { counter-increment: fig; font-size: 8.8pt; color: var(--muted); margin-top: 5px; text-align: center; }
  figcaption::before { content: "Figure " counter(fig) " \2014  "; font-weight: 700; color: var(--brand); }

  .callout { border-left: 4px solid var(--brand); background: var(--brand-soft); padding: 8px 12px; border-radius: 0 6px 6px 0; margin: 10px 0; break-inside: avoid; font-size: 10pt; }
  .callout b.t { display: block; color: var(--navy); margin-bottom: 1px; }
  .callout.rule { border-color: #7c3aed; background: #f5f3ff; } .callout.rule b.t { color: #5b21b6; }
  .callout.warn { border-color: #d97706; background: var(--amber-soft); } .callout.warn b.t { color: var(--amber); }
  .callout.ok { border-color: #059669; background: var(--green-soft); } .callout.ok b.t { color: var(--green); }
  .callout.todo { border-color: #dc2626; background: var(--red-soft); } .callout.todo b.t { color: var(--red); }

  table { width: 100%; border-collapse: collapse; margin: 8px 0 12px; font-size: 9.2pt; }
  thead { display: table-header-group; }
  tr { break-inside: avoid; page-break-inside: avoid; }
  th { background: var(--navy); color: #fff; text-align: left; font-weight: 600; padding: 5px 7px; }
  td { border-bottom: 1px solid var(--line); padding: 4px 7px; vertical-align: top; }
  tbody tr:nth-child(even) td { background: #f8f9fc; }

  /* cover */
  .cover { height: 263mm; display: flex; flex-direction: column; justify-content: space-between; break-after: page; page-break-after: always; }
  .cover .band { background: var(--navy); color: #fff; border-radius: 16px; padding: 38px 36px 34px; position: relative; overflow: hidden; }
  .cover .band::after { content: ""; position: absolute; right: -40px; top: -40px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(212,242,74,.35), rgba(212,242,74,0) 70%); }
  .cover .logo { height: 17mm; display: block; margin-bottom: 26px; }
  .cover h1 { font-size: 40pt; margin: 0 0 6px; letter-spacing: -.02em; }
  .cover .sub { font-size: 16pt; color: var(--lime); font-weight: 600; }
  .cover .sub2 { margin-top: 16px; font-size: 12pt; opacity: .85; max-width: 130mm; }
  .cover .hero img { width: 100%; border: 1px solid #d1d5db; border-radius: 10px; }
  .cover .meta { font-size: 10pt; color: var(--muted); }
  .cover .meta table { margin: 0; }
  .cover .meta td { border: 0; padding: 3px 8px 3px 0; background: none !important; }
  .cover .meta td:first-child { color: #6b7280; width: 36mm; }

  /* toc */
  .tocpage { break-after: page; page-break-after: always; }
  .toc { font-size: 10pt; }
  .toc a { display: flex; color: var(--ink); padding: 1.6px 0; }
  .toc a .t { flex: 0 1 auto; } .toc a .dots { flex: 1; border-bottom: 1px dotted #9ca3af; margin: 0 6px 5px; } .toc a .pg { flex: 0 0 auto; min-width: 7mm; text-align: right; color: var(--brand); font-weight: 600; }
  .toc a.l1 { font-weight: 700; margin-top: 6px; color: var(--navy); }
  .toc a.l2 { padding-left: 7mm; font-size: 9.2pt; }
  .about { break-after: avoid; }
</style>
</head>
<body>
